<header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-950/90 backdrop-blur-lg border-b border-gray-100 dark:border-gray-800">
  <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
    <a href="/" class="flex items-center gap-2 shrink-0">
      <img src="/assets/images/oaxacoders.svg" alt="Oaxacoders" class="h-7 sm:h-9 dark:hidden" />
      <img src="/assets/images/oaxacoders-dark.svg" alt="Oaxacoders" class="h-7 sm:h-9 hidden dark:block" />
    </a>

    <!-- Desktop nav -->
    <div class="hidden xl:flex items-center gap-1 ml-auto">
      <a href="/eventos/" class="px-3 py-2 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:text-teal-500 dark:hover:text-teal-200 hover:bg-teal-50 dark:hover:bg-gray-800 transition">Eventos</a>
      <a href="/eventos/hacktoberfest-hack-day-oaxaca-2026/" class="inline-flex items-center gap-1.5 ml-1 px-3 py-2 rounded-lg text-sm font-bold text-white bg-[#e73122] hover:bg-[#b32319] transition shadow-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-[#facc15] animate-pulse"></span>
        Hacktoberfest
      </a>
      <a href="/blog/" class="px-3 py-2 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:text-teal-500 dark:hover:text-teal-200 hover:bg-teal-50 dark:hover:bg-gray-800 transition">Blog</a>
      <a href="/nosotros/" class="px-3 py-2 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:text-teal-500 dark:hover:text-teal-200 hover:bg-teal-50 dark:hover:bg-gray-800 transition">Nosotros</a>
      <a href="/agradecimientos/" class="px-3 py-2 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:text-teal-500 dark:hover:text-teal-200 hover:bg-teal-50 dark:hover:bg-gray-800 transition">Agradecimientos</a>
      <a href="{{ site.community.telegram }}" target="_blank" rel="noopener"
         class="ml-2 px-4 py-2 rounded-lg text-sm font-semibold text-white dark:text-navy-950 bg-accent-500 hover:bg-accent-600 transition shadow-sm">
        Unirse
      </a>
    </div>

    <div class="flex items-center gap-2">
      {% include theme-toggle.html %}

      <!-- Mobile hamburger -->
      <button type="button" id="menu-toggle" class="xl:hidden min-w-11 min-h-11 p-2 rounded-lg text-navy-600 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-500" aria-label="Menú" aria-controls="mobile-menu" aria-expanded="false">
        <svg id="menu-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="hidden xl:hidden border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-950">
    <div class="px-4 py-3 space-y-1">
      <a href="/eventos/" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:bg-teal-50 dark:hover:bg-gray-800 hover:text-teal-600 dark:hover:text-teal-200 transition">Eventos</a>
      <a href="/eventos/hacktoberfest-hack-day-oaxaca-2026/" class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-bold text-white bg-[#e73122] hover:bg-[#b32319] transition">
        <span class="w-1.5 h-1.5 rounded-full bg-[#facc15] animate-pulse"></span>
        Hacktoberfest · 31 Oct
      </a>
      <a href="/blog/" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:bg-teal-50 dark:hover:bg-gray-800 hover:text-teal-600 dark:hover:text-teal-200 transition">Blog</a>
      <a href="/nosotros/" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:bg-teal-50 dark:hover:bg-gray-800 hover:text-teal-600 dark:hover:text-teal-200 transition">Nosotros</a>
      <a href="/agradecimientos/" class="block px-3 py-2.5 rounded-lg text-sm font-medium text-navy-700 dark:text-gray-200 hover:bg-teal-50 dark:hover:bg-gray-800 hover:text-teal-600 dark:hover:text-teal-200 transition">Agradecimientos</a>
      <a href="{{ site.community.telegram }}" target="_blank" rel="noopener"
         class="block mt-2 px-3 py-2.5 rounded-lg text-sm font-semibold text-center text-white dark:text-navy-950 bg-accent-500 hover:bg-accent-600 transition">
        Unirse a la comunidad
      </a>
    </div>
  </div>

  <script>
    document.getElementById('menu-toggle').addEventListener('click', function () {
      var menu = document.getElementById('mobile-menu');
      var open = document.getElementById('menu-icon-open');
      var close = document.getElementById('menu-icon-close');
      var collapsed = menu.classList.toggle('hidden');
      this.setAttribute('aria-expanded', String(!collapsed));
      open.classList.toggle('hidden');
      close.classList.toggle('hidden');
    });
  </script>
</header>
